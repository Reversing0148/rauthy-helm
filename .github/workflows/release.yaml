name: Release Charts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v4.1.3

      - name: Set up dependencies
        run: |
          helm plugin install https://github.com/karuppiah7890/helm-schema-gen.git --verify=false

      - name: Create values.schema.json
        run: |
          helm schema-gen charts/rauthy-helm/values.yaml > charts/rauthy-helm/values.schema.json

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_RELEASE_NAME_TEMPLATE: "rauthy-helm-{{ .Version }}"